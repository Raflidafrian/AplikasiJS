<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Pertemuan 14 - Input Data Mahasiswa</title>
    <link rel="stylesheet" href="../shared/styles/base.css">
    <style>
        body {
            padding: 40px 20px;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #333;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h2 {
            color: #1e3c72;
            margin-top: 0;
            font-weight: 600;
        }

        .section-title {
            margin-top: 40px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group input, .form-group select {
            height: 41px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
        }

        .btn-submit.mode-edit {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        .btn-submit.mode-edit:hover {
            background: linear-gradient(135deg, #d97706, #b45309);
        }

        .btn-action {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        th:nth-child(1), td:nth-child(1) { width: 50px; text-align: center; }
        th:nth-child(2), td:nth-child(2) { width: 140px; }
        th:nth-child(6), td:nth-child(6) { width: 140px; text-align: center; }

        .empty-row {
            text-align: center;
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Form Input Data Mahasiswa</h2>
    
    <form id="formMahasiswa">
        <div class="form-grid">
            <div class="form-group">
                <label for="nim">NIM</label>
                <input type="text" id="nim" required placeholder="Contoh: 231011450315">
            </div>
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" required placeholder="Contoh: Rafli Dafrian">
            </div>
            <div class="form-group">
                <label for="jurusan">Jurusan</label>
                <select id="jurusan" required>
                    <option value="" disabled selected hidden>Pilih Jurusan...</option>
                    <option value="Akuntansi">Akuntansi</option>
                    <option value="Akuntansi Perpajakan">Akuntansi Perpajakan</option>
                    <option value="Ilmu Hukum">Ilmu Hukum</option>
                    <option value="Manajemen">Manajemen</option>
                    <option value="Matematia">Matematika</option>
                    <option value="Sains Data">Sains Data</option>
                    <option value="Sains Inggris">Sastra Inggris</option>
                    <option value="Sains Indonesia">Sastra Indonesia</option>
                    <option value="Teknik Elektro">Teknik Elektro</option>
                    <option value="Teknik Informatika">Teknik Informatika</option>
                    <option value="Teknik Industri">Teknik Industri</option>
                    <option value="Teknik kimia">Teknik Kimia</option>
                    <option value="Sistem Komputer">Sistem Komputer</option>
                    <option value="Teknik Mesin">Teknik Mesin</option>
                    <option value="Teknik Sistem Informasi">Teknik Sistem Informasi</option>
                </select>
            </div>
            <div class="form-group">
                <label for="fakultas">Fakultas</label>
                <select id="fakultas" required>
                    <option value="" disabled selected hidden>Pilih Fakultas...</option>
                    <option value="Fakultas Teknik">Fakultas Teknik</option>
                    <option value="Fakultas Ilmu Komputer">Fakultas Ilmu Komputer</option>
                    <option value="Fakultas Ekonomi">Fakultas Ekonomi dan Bisnis</option>
                    <option value="Fakultas MIPA">Fakultas MIPA</option>
                    <option value="Fakultas Sastra">Fakultas Sastra</option>
                    <option value="Fakultas Hukum">Fakultas Hukum</option>
                    <option value="Fakultas Keguruan dan Ilmu Pendidikan">Fakultas Keguruan dan Ilmu Pendidikan</option>
                </select>
            </div>
        </div>
        <button type="submit" id="btnSubmit" class="btn btn-submit">Tambah Mahasiswa</button>
    </form>

    <h2 class="section-title">Daftar Mahasiswa</h2>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>NIM</th>
                    <th>Nama</th>
                    <th>Jurusan</th>
                    <th>Fakultas</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tabelData">
                <tr id="placeholderRow">
                    <td colspan="6" class="empty-row">Belum ada data mahasiswa yang dimasukkan.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="../shared/utils/dom.js"></script>
<script src="../shared/utils/validation.js"></script>
<script src="../shared/utils/table.js"></script>
<script>
    const dataMahasiswa = [];
    let editIndex = null;

    const form = getElement('formMahasiswa');
    const tabelBody = getElement('tabelData');
    const btnSubmit = getElement('btnSubmit');

    const FIELD_MAP = { nim: 'nim', nama: 'nama', jurusan: 'jurusan', fakultas: 'fakultas' };
    const COLUMNS = ['nim', 'nama', 'jurusan', 'fakultas'];

    const TABLE_OPTIONS = {
        emptyMessage: 'Belum ada data mahasiswa yang dimasukkan.',
        showIndex: true,
        actionRenderer: function(item, index) {
            return '<div class="action-buttons">' +
                '<button class="btn-action btn-edit" onclick="mulaiEditData(' + index + ')">Edit</button>' +
                '<button class="btn-action btn-delete" onclick="hapusData(' + index + ')">Hapus</button>' +
                '</div>';
        }
    };

    form.addEventListener('submit', function(event) {
        event.preventDefault();

        // Collect form data using shared utility
        const dataInputan = collectFormData(FIELD_MAP);

        // Validate required fields using shared utility
        const validation = validateRequired(Object.values(FIELD_MAP));
        if (!validation.valid) {
            showValidationError("Semua field harus diisi!");
            return;
        }

        if (editIndex === null) {
            dataMahasiswa.push(dataInputan);
        } else {
            dataMahasiswa[editIndex] = dataInputan;
            editIndex = null;
            btnSubmit.innerText = "Tambah Mahasiswa";
            btnSubmit.classList.remove('mode-edit');
        }

        // Render table using shared utility
        renderTableData('tabelData', dataMahasiswa, COLUMNS, TABLE_OPTIONS);
        form.reset();
        focusElement('nim');
    });

    function mulaiEditData(index) {
        editIndex = index;
        const mahasiswaTerpilih = dataMahasiswa[index];

        // Populate form fields using shared utility
        setInputValue('nim', mahasiswaTerpilih.nim);
        setInputValue('nama', mahasiswaTerpilih.nama);
        setInputValue('jurusan', mahasiswaTerpilih.jurusan);
        setInputValue('fakultas', mahasiswaTerpilih.fakultas);

        btnSubmit.innerText = "Update Data Mahasiswa";
        btnSubmit.classList.add('mode-edit');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function hapusData(index) {
        if (editIndex === index) {
            editIndex = null;
            btnSubmit.innerText = "Tambah Mahasiswa";
            btnSubmit.classList.remove('mode-edit');
            form.reset();
        }

        // Delete and re-render using shared utility
        deleteTableRow(dataMahasiswa, index, 'tabelData', COLUMNS, TABLE_OPTIONS);
    }
</script>
</body>
</html>
