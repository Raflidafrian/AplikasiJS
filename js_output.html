<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Output</title>
</head>
<body>
    <script>
        // Output di JavaScript
        console.log ("Hello, World!"); // Output: Hello, World!
        alert ("Selamat datang di JavaScript!"); // Menampilkan pesan dalam kotak dialog
        document.write ("Ini adalah output dari JavaScript!"); // Menulis output langsung ke halaman
    </script>
    
</body>
</html>
