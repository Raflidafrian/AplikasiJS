<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Function 1</title>
</head>
<body>
    <script>
        <P>Fungsi dalam JavaScript</P>
        // fungsi tanpa parameter
        function hallo() {
            console.log ("hallo semua");
        } 
        halo();
        
        function sapa(nama) {
            console.log ("hallo" + nama); 
        }
        sapa("Budi");
        
        // fungsi return value
        function tambah(a, b) {
            return a + b;
        }

        var hasil = tambah(5, 3);
        console.log ("hasil"); // Output: 8
    </script>
    
</body>
</html>
