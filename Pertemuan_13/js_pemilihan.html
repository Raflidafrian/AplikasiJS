<!DOCTYPE html>
<html lang="en">
<head>

    <title>Pemilihan HTML</title>

<body>
    <h1>PEMILIHAN HTML</h1>
    <p>Contoh penggunaan pemilihan dalam JavaScript</p>
    <script src="../shared/utils/grading.js"></script>
    <script>
        // Menggunakan shared utility evaluatePassFail
        var nilai1 = 80;
        var result1 = evaluatePassFail(nilai1, 75);
        console.log(result1.status); // Output: LULUS

        var nilai2 = 60;
        var result2 = evaluatePassFail(nilai2, 75);
        console.log(result2.status); // Output: TIDAK LULUS

        // Menggunakan shared utility getLetterGrade
        var nilai3 = 85;
        var grade = getLetterGrade(nilai3);
        console.log(grade.grade + ", " + grade.description); // Output: B, Memuaskan
    </script>
