<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemilihan HTML</title>
</head>
<body>
    <h1>PEMILIHAN HTML</h1>
    <p>Contoh penggunaan pemilihan dalam JavaScript</p>
    <script>
        // if statement
        var nilai = 80;
        if (nilai >= 75) {
            console.log ("LULUS");
        }
        var nilai = 60;
        if (nilai >= 75) {
            console.log ("LULUS");
        }
        else {
            console.log ("TIDAK LULUS");
        }

        //  if else if
        var nilai = 85;
        if (nilai >= 90) {
            console.log ("A, sangat memuaskan");
        }
        else if (nilai >= 75) {
            console.log ("B, memuaskan");
        }
        else if (nilai >= 70) {
            console.log ("C, tidak memuaskan");
        }
        else if (nilai >= 60) {
            console.log ("D");
        }
        else {
            console.log ("E");
        }
    </script>
    
</body>
</html>
