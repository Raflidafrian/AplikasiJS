<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form JS Function</title>
</head>
<body>
    
    <h3>Form JS Function</h3>
    <p>Form ini digunakan untuk mengirim data ke server menggunakan JavaScript.</p>
    
    <form>
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama"><br><br>
        <label for="umur">Umur:</label>
        <input type="number" id="umur" name="umur"><br><br>
        <button type="button" onclick="submitForm()">Submit</button>
    </form>

    <form>
        <label for="nama2">Nama:</label>
        <input type="text" id="nama2" name="nama"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        <input type="submit" onclick="validateContactForm();" value="submit">
    </form>
    <p id="result"></p>

    <script src="../shared/utils/dom.js"></script>
    <script src="../shared/utils/validation.js"></script>
    <script>
        // fungsi untuk mengirim data menggunakan shared utilities
        function submitForm() {
            var nama = getValue('nama');
            var umur = getValue('umur');
            console.log("Nama: " + nama);
            console.log("Umur: " + umur);
        }

        // fungsi validasi form menggunakan shared utilities
        function validateContactForm() {
            var validation = validateRequired(['nama2', 'email']);
            if (!validation.valid) {
                setHTML('result', "Nama dan Email harus diisi!");
            } else {
                setHTML('result', "Form berhasil disubmit!");
            }
        }
    </script>

</body>
</html>
