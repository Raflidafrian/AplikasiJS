<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Operator Perbandingan</title>
</head>
<body>
    <h4>Operator Perbandingan</h4>
    <script>
        var a = 5;
        var b = 10;

        console.log(a == b); // Output: false
        console.log(a != b); // Output: true
        console.log(a > b); // Output: false
        console.log(a < b); // Output: true
        console.log(a >= b); // Output: false
        console.log(a <= b); // Output: true
    </script>
</body>
</html>
