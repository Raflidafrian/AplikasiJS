<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Membuat Aplikasi JS - Operator Lengkap</title>
    <link rel="stylesheet" href="../shared/styles/base.css">
    <style>
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 10px;
        }
        .result-box.lulus {
            background-color: #f0fff4;
            border-left-color: #38a169;
            color: #276749;
        }
        .result-box.gagal {
            background-color: #fff5f5;
            border-left-color: #e53e3e;
            color: #9b2c2c;
        }
        .result-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Kalkulator Kelulusan</h2>
    
    <div class="form-group">
        <label for="nilaiTugas">Nilai Tugas (Bobot 40%):</label>
        <input type="number" id="nilaiTugas" class="form-input" placeholder="0 - 100" min="0" max="100">
    </div>

    <div class="form-group">
        <label for="nilaiUjian">Nilai Ujian (Bobot 60%):</label>
        <input type="number" id="nilaiUjian" class="form-input" placeholder="0 - 100" min="0" max="100">
    </div>

    <button class="btn btn-primary btn-full" onclick="prosesEvaluasi()">Hitung Nilai & Cek</button>

    <div class="result-box" id="resultBox">
        <div class="result-title" id="statusOutput"></div>
        <div id="detailOutput"></div>
    </div>
</div>

<script src="../shared/utils/dom.js"></script>
<script src="../shared/utils/validation.js"></script>
<script src="../shared/utils/grading.js"></script>
<script>
function prosesEvaluasi() {
    // Mengambil nilai dari input form menggunakan shared utility
    let tugas = getNumericValue('nilaiTugas');
    let ujian = getNumericValue('nilaiUjian');

    // Validasi input menggunakan shared utility
    if (!isValidNumber(tugas) || !isValidNumber(ujian)) {
        showValidationError("Silakan masukkan kedua nilai terlebih dahulu!");
        return;
    }

    // Menghitung Nilai Akhir menggunakan shared utility
    let nilaiAkhir = calculateWeightedScore([
        { score: tugas, weight: 0.4 },
        { score: ujian, weight: 0.6 }
    ]);

    // Simulasi penambahan nilai bonus absensi
    let bonusAbsen = 3;
    nilaiAkhir += bonusAbsen;

    // Evaluasi kelulusan menggunakan shared utility
    let hasil = evaluatePassFail(nilaiAkhir, 70);

    // Manipulasi DOM menggunakan shared utilities
    let box = getElement('resultBox');
    box.style.display = "block";
    
    if (hasil.passed) {
        box.className = "result-box lulus";
        setHTML('statusOutput', "Selamat, Anda LULUS! 🎉");
    } else {
        box.className = "result-box gagal";
        setHTML('statusOutput', "Maaf, Anda Harus REVISI! 📚");
    }

    setHTML('detailOutput', `Nilai Akhir (Termasuk Bonus +${bonusAbsen}): <strong>${nilaiAkhir.toFixed(1)}</strong>`);
}
</script>

</body>
</html>
