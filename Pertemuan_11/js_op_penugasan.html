<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS_Operator_Penugasan</title>
</head>
<body>

    <h4>Operator Penugasan</h4>
    <p>Contoh penggunaan operator penugasan dalam JavaScript</p>
    <script>
        var a = 10; // operator penugasan sederhana
        a += 5; // operator penugasan tambah
        console.log(a); // Output: 15

        var b = 20;
        b -= 3; // operator penugasan kurang
        console.log(b); // Output: 17

        var c = 4;
        c *= 2; // operator penugasan kali
        console.log(c); // Output: 8

        var d = 10;
        d /= 2; // operator penugasan bagi
        console.log(d); // Output: 5

        var e = 7;
        e %= 3; // operator penugasan modulus
        console.log(e); // Output: 1
    </script>

</body>
</html>
