<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Sintax</title>
</head>
<body>
    <script>
        // sintaks dasar JavaScript
        console.log ("Hello, World!");  // Output: Hello, World!
        var x = 5; // mendeklarasikan variabel x dengan nilai 5
        var y = 10; // mendeklarasikan variabel y dengan nilai 10
        var z = x + y; // menjumlahkan x dan y, hasilnya disimpan di variabel z
        console.log (z); // Output: 15
    </script>
    
</body>
</html>
