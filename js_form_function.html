<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form JS Function</title>
</head>
<body>
    
    <h3>Form JS Function</h3>
    <p>Form ini digunakan untuk mengirim data ke server menggunakan JavaScript.</p>
    
    <form>
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama"><br><br>
        <label for="umur">Umur:</label>
        <input type="number" id="umur" name="umur"><br><br>
        <button type="button" onclick="submitForm()">Submit</button>
    </form>
    <script>
        // fungsi untuk mengirim data ke server
        function submitForm() {
            var nama = document.getElementById("nama").value;
            var umur = document.getElementById("umur").value;
            console.log("Nama: " + nama);
            console.log("Umur: " + umur);
        }
    </script>

    <form>
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        <input type="submit" onclick="validateForm();" value="submit">
    </form>

    <script>
        // fungsi validasi form
        function validateForm() {
            var nama = document.getElementById("nama").value;
            var email = document.getElementById("email").value;
            if (nama == "" || email == "") {
                document.getElementById("result").innerHTML = "Nama dan Email harus diisi!";
            } else {
                document.getElementById("result").innerHTML = "Form berhasil disubmit!";
            }
        }
    </script>
    <p id="result"></p>

</body>
</html>
